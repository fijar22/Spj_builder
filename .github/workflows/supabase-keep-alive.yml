name: Supabase Keep Alive

on:
  schedule:
    # Every day at 02:17 UTC (09:17 WIB)
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          echo "Checking Supabase database..."

          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_ANON_KEY is not configured."
            exit 1
          fi

          # Make several lightweight REAL database requests.
          # This is intentionally a SELECT against the existing licenses table.
          for i in 1 2 3; do
            echo "Database request ${i}/3..."

            HTTP_CODE=$(curl -sS               -o "/tmp/supabase_response_${i}.txt"               -w "%{http_code}"               "${SUPABASE_URL}/rest/v1/licenses?select=id&limit=1"               -H "apikey: ${SUPABASE_ANON_KEY}"               -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"               -H "Accept: application/json")

            echo "HTTP status: ${HTTP_CODE}"

            if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
              echo "Supabase database request failed:"
              cat "/tmp/supabase_response_${i}.txt"
              exit 1
            fi

            sleep 3
          done

          echo "Supabase database activity completed successfully."
