name: Supabase Keep Alive

on:
  schedule:
    # Every 2 days at 02:17 UTC (09:17 WIB)
    - cron: "17 2 */2 * *"
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest

    steps:
      - name: Check Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          echo "Checking Supabase..."

          HTTP_CODE=$(curl -sS -o /tmp/supabase_response.txt -w "%{http_code}"             "${SUPABASE_URL}/rest/v1/licenses?select=id&limit=1"             -H "apikey: ${SUPABASE_ANON_KEY}"             -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 300 ]; then
            echo "Supabase is reachable."
            exit 0
          fi

          echo "Supabase request failed:"
          cat /tmp/supabase_response.txt
          exit 1
